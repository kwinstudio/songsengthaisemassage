.item{padding:11px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 5px 0 #eee2da}

.final-actions{display:grid;gap:8px;margin-top:12px}
.darkbtn,.wabtn,.reset{border:0}
.darkbtn{background:#fff;color:var(--ink);box-shadow:0 6px 0 #d9cec6}
.wabtn{background:var(--green);color:#073514;box-shadow:0 6px 0 #149a44}
.reset{border:1px solid rgba(255,255,255,.2);background:transparent;color:#ddd}

.toast{position:fixed;z-index:99;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88vw;padding:10px 14px;border-radius:999px;background:var(--ink);color:#fff;text-align:center;font-size:11px;font-weight:900;box-shadow:0 12px 30px rgba(48,40,37,.25);animation:toast .25s var(--ease)}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px) scale(.94)}}

@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(160deg) scale(1.45);opacity:0}}
.stamp{position:fixed;z-index:94;pointer-events:none;padding:8px 12px;border:3px solid var(--rose2);color:var(--rose2);font-size:11px;font-weight:1000;text-transform:uppercase;border-radius:8px;background:#fff8;animation:stamp .75s var(--ease) forwards}
@keyframes stamp{0%{transform:scale(2.2) rotate(-15deg);opacity:0}45%{transform:scale(.92) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-5deg);opacity:0}}
@media(max-width:370px){h1{font-size:41px}h2{font-size:30px}.scene{height:270px}.photo-card{width:158px;height:218px;margin-left:-79px}.dossier-scene{min-height:590px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.photo-card,.card,.dossier{transform:none!important}}
</style>

}
function deckHTML(){
  return '<div class="scene" id="scene"><div class="deck">'+P.map(function(src,n){return '<button class="photo-card" data-photo="'+n+'" aria-label="Foto '+(n+1)+'"><img src="'+src+'" alt="Sophie foto '+(n+1)+'"><span class="badge">'+(n===2?"deze dus 👀":"Sophie "+(n+1))+'</span></button>'}).join("")+'</div><span class="float-tag tag-a">boosig-meter™</span><span class="float-tag tag-b">joh 😌</span><span class="float-tag tag-c">toch?</span><div class="deck-hint">← swipe door de foto's →</div></div>'
}
function bindDeck(){
  var s=document.getElementById("scene");if(!s)return;positionDeck();
  s.onpointerdown=function(e){dragging=true;dragStart=e.clientX;dragX=0;s.setPointerCapture&&s.setPointerCapture(e.pointerId)};
  s.onpointermove=function(e){if(!dragging)return;dragX=e.clientX-dragStart;positionDeck()};
  s.onpointerup=s.onpointercancel=function(e){if(!dragging)return;dragging=false;if(dragX<-34)photo=(photo+1)%6;else if(dragX>34)photo=(photo+5)%6;dragX=0;positionDeck()};
  Array.from(document.querySelectorAll(".photo-card")).forEach(function(c){c.onclick=function(){photo=+c.dataset.photo;positionDeck();say("foto "+(photo+1)+" geselecteerd. Joh.")}})
}
function intro(){
  stage.innerHTML='<article class="card enter" id="card">'+deckHTML()+'<span class="kicker">zeer serieus mini-onderzoek</span><h1>Sophie is<br><em>boosig.</em></h1><p class="lead">We hebben gepraat. Alles is oké. Dus uiteraard heb ik er een compleet overdreven mobiele 3D-website van gemaakt. Toch.</p><div class="meter-wrap"><div class="meter-top"><b>live boosig-meter</b><span class="meter-face" id="meterFace">'+esc(meterText(meter))+'</span></div><input id="meter" type="range" min="0" max="100" value="'+meter+'" aria-label="Boosig meter"></div><div class="actions"><button class="primary" id="start">Oké dan, kom maar door →</button><button class="secondary" id="shareSite">Stuur deze site via WhatsApp ↗</button></div><p class="micro">7 vragen • zes foto's • veel te veel 3D • nul therapie.</p></article>';
  bindDeck();attachTilt(document.getElementById("card"));
  document.getElementById("start").onclick=function(e){burst(e.clientX,e.clientY);i=0;render()};
  document.getElementById("shareSite").onclick=shareSite;
  document.getElementById("meter").oninput=function(e){meter=+e.target.value;document.getElementById("meterFace").textContent=meterText(meter);document.querySelector(".meter-wrap").style.transform="translateZ(18px) rotateY("+((meter-50)/16)+"deg)"}
}
function render(){
  var q=Q[i],pct=Math.round((i+1)/7*100),body="";
  if(q[1])body='<div class="options">'+q[1].map(function(o,n){return '<button class="option '+(A[i]===o?'sel':'')+'" data-n="'+n+'"><span class="key">'+String.fromCharCode(65+n)+'</span><span>'+esc(o)+'</span><span class="tick">✓</span></button>'}).join("")+'</div>';
  else body='<textarea id="free" placeholder="Kom maar door. Ik doe alsof ik niet nieuwsgierig ben 😉">'+esc(A[i])+'</textarea>';
  stage.innerHTML='<article class="card enter" id="card"><div class="progressrow"><span>'+(i+1)+'/7</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span>'+pct+'%</span></div><div class="qtop"><button class="thumbbtn" id="thumb"><img class="thumb" src="'+P[photo]+'" alt="Sophie"><i>↻</i></button><div class="vibe"><b>vraag '+(i+1)+'</b>huidige vibe: '+mood()+'<small>tik op de foto, joh</small></div></div><h2>'+q[0]+'</h2>'+body+'<div class="nav"><button class="secondary" id="back">← terug</button><button class="primary" id="next">'+(i===6?'toon het 3D-dossier':'volgende joh →')+'</button></div><button class="objection" id="obj">ik wil bezwaar maken</button></article>';
  attachTilt(document.getElementById("card"));
  document.getElementById("thumb").onclick=function(e){photo=(photo+1)%6;say("andere Sophie unlocked ✨");burst(e.clientX,e.clientY);render()};
  Array.from(document.querySelectorAll(".option")).forEach(function(b){b.onclick=function(e){var n=+b.dataset.n;A[i]=q[1][n];saveLocal();say(q[2][n]);burst(e.clientX,e.clientY);stamp(e.clientX,e.clientY,n===3?"GENOTEERD":"TOCH");render()}});
  var free=document.getElementById("free");if(free)free.oninput=function(){A[i]=free.value;saveLocal()};
  document.getElementById("back").onclick=function(){if(i===0)intro();else{i--;render()}};
  document.getElementById("next").onclick=function(e){var f=document.getElementById("free");if(f)A[i]=f.value.trim();if(!A[i]){var c=document.getElementById("card");c.classList.add("shake");say("Eerst iets kiezen, mevrouw 😌");setTimeout(function(){c&&c.classList.remove("shake")},430);return}saveLocal();if(i===6){burst(e.clientX,e.clientY);done()}else{i++;render()}};
  var obj=document.getElementById("obj"),taps=0;
  obj.onclick=function(e){taps++;var x=["Bezwaar afgewezen. Toch? 😂","Uw advocaat belt later terug.","Sterk bezwaar. Niks mee gedaan.","JOL. Volgende vraag joh."];say(x[Math.floor(Math.random()*x.length)]);stamp(e.clientX,e.clientY,"AFGEWEZEN");obj.style.transform="translateX("+((Math.random()-.5)*80)+"px) rotate("+((Math.random()-.5)*14)+"deg)";setTimeout(function(){obj.style.transform=""},650)}
}
function answersText(){return "Sophie is boosig 😂❤️\\n\\n"+Q.map(function(q,n){return (n+1)+". "+q[0]+"\\n"+(A[n]||"—")}).join("\\n\\n")}
function done(){
  stage.innerHTML='<article class="final enter"><div class="dossier-scene"><div class="dossier" id="dossier"><section class="dossier-face dossier-front"><span class="kicker">dossier gesloten</span><h2>Sophie heeft<br>gesproken.</h2><p>Conclusie: mevrouw is <strong>'+mood()+'</strong>. Kwin krijgt voorwaardelijk toegang tot de rest van de dag. Toch.</p><div class="photos"><img src="'+P[2]+'" alt="Sophie"><img src="'+P[4]+'" alt="Sophie"><img src="'+P[5]+'" alt="Sophie"></div><button class="flipbtn" id="flip">draai het dossier om ↻</button><div class="final-actions"><button class="darkbtn" id="shareA">deel / kopieer mijn antwoorden</button><button class="wabtn" id="shareS">stuur de site via WhatsApp</button><button class="reset" id="reset">nog een keer joh</button></div></section><section class="dossier-face dossier-back"><span class="kicker">bewijsstukken</span><h2 style="font-size:36px;color:#302825">Uw verklaringen,<br>mevrouw.</h2><div class="summary">'+Q.map(function(q,n){return '<div class="item"><b>'+(n+1)+'. '+q[0]+'</b><span>'+esc(A[n]||"—")+'</span></div>'}).join("")+'</div><button class="secondary backreset" id="flipBack" style="margin-top:12px">← terug naar conclusie</button></section></div></div></article>';
  var d=document.getElementById("dossier");
  document.getElementById("flip").onclick=function(e){d.classList.add("flipped");burst(e.clientX,e.clientY)};
  document.getElementById("flipBack").onclick=function(){d.classList.remove("flipped")};
  document.getElementById("shareA").onclick=async function(){var text=answersText();try{if(navigator.share)await navigator.share({title:"Sophie is boosig",text:text});else{await navigator.clipboard.writeText(text);say("Gekopieerd joh ✨")}}catch(e){}};
  document.getElementById("shareS").onclick=shareSite;
  document.getElementById("reset").onclick=function(){A=["","","","","","",""];saveLocal();i=0;photo=2;intro()}
}
document.getElementById("home").onclick=intro;
document.getElementById("jol").onclick=function(e){secret++;say(secret<3?"JOL. Geen noodknop nodig 😂":secret<6?"Mevrouw blijft gewoon klikken hè 👀":"OKÉ JOH. JOL-MODUS ONTGRENDELD.");burst(e.clientX,e.clientY);document.body.style.transform=secret%3===0?"perspective(1000px) rotateY(1.2deg)":"";setTimeout(function(){document.body.style.transform=""},420)};
loadLocal();intro();
})();
</script>
</body>
